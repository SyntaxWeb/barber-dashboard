services:
  app:
    container_name: barber_dashboard
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PRODUCTION_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - 4002:80
